# One-command setup:  docker compose up -d
# Then open http://localhost:8000
services:
  snitchofdalal:
    # Uses the prebuilt image when available; otherwise builds from this folder.
    image: ghcr.io/sardarkagrandson/marketwatch:latest
    build: .
    container_name: snitchofdalal
    restart: unless-stopped
    ports:
      # Bound to this computer only by default. Set BIND_HOST=0.0.0.0 in .env to allow other devices on your network.
      - "${BIND_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"
    # Layered settings: .env.example holds the operator's defaults for every installation
    # (shared email sender, licence public key, AI key); .env holds this machine's overrides.
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data
      - TZ=Asia/Kolkata
    volumes:
      # Keeps your watchlist, portfolio, caches and saved alert emails across restarts/updates.
      - snitchofdalal-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  snitchofdalal-data:
